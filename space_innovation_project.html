<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>우리 동네 공간 혁신 프로젝트 · 김포</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gaegu:wght@400;700&family=Baloo+2:wght@500;600;700;800&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root{
    --cream:#FFF8EC;
    --cream-2:#FFF1DC;
    --brown:#5B4130;
    --brown-70:rgba(91,65,48,0.72);
    --brown-45:rgba(91,65,48,0.48);
    --mint:#8FD4B8;
    --mint-dark:#4E9E7C;
    --mint-line:#E4F3EC;
    --yellow:#FFC857;
    --yellow-dark:#E8A928;
    --coral:#FF8C69;
    --coral-dark:#F26B41;
    --sky:#BEE3F8;
    --sky-dark:#8FCBEF;
    --naver:#03C75A;
    --white:#FFFFFF;
    --radius:20px;
    --radius-sm:12px;
    --shadow-pop: 4px 4px 0 rgba(91,65,48,0.9);
    --shadow-pop-sm: 3px 3px 0 rgba(91,65,48,0.9);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--cream);
    color:var(--brown);
    font-family:'Noto Sans KR', sans-serif;
    -webkit-font-smoothing:antialiased;
    background-image:
      radial-gradient(circle at 92% 8%, rgba(255,200,87,0.25) 0, transparent 40%),
      radial-gradient(circle at 6% 90%, rgba(143,212,184,0.25) 0, transparent 40%);
  }
  ::selection{background:var(--coral); color:#fff;}
  button{font-family:inherit;}
  .app{display:flex; min-height:100vh; width:100%;}

  /* ---------- SIDEBAR ---------- */
  .sidebar{
    width:264px; flex-shrink:0;
    background:var(--mint-dark);
    color:#fff;
    padding:26px 20px 20px;
    display:flex; flex-direction:column;
    position:sticky; top:0; height:100vh; overflow-y:auto;
    border-right:3px solid var(--brown);
  }
  .brand-emoji{font-size:30px; margin-bottom:6px;}
  .brand-title{font-family:'Jua', sans-serif; font-size:23px; line-height:1.4; margin-bottom:4px;}
  .brand-sub{font-size:12.5px; color:rgba(255,255,255,0.85); margin-bottom:22px;}
  .progress-track{height:10px; background:rgba(255,255,255,0.25); border-radius:10px; overflow:hidden; margin-bottom:5px; border:2px solid rgba(255,255,255,0.4);}
  .progress-fill{height:100%; background:var(--yellow); width:0%; transition:width .4s ease; border-radius:10px;}
  .progress-label{font-size:11.5px; color:rgba(255,255,255,0.85); margin-bottom:20px;}
  .nav-list{list-style:none; margin:0; padding:0; flex:1;}
  .nav-item{display:flex; align-items:flex-start; gap:10px; padding:10px 11px; border-radius:14px; cursor:pointer; margin-bottom:4px; transition:all .15s ease; border:2px solid transparent;}
  .nav-item:hover{background:rgba(255,255,255,0.14);}
  .nav-item.active{background:var(--white); border-color:var(--brown);}
  .nav-num{font-family:'Baloo 2', sans-serif; font-weight:700; font-size:12px; color:rgba(255,255,255,0.7); padding-top:2px; min-width:22px;}
  .nav-item.active .nav-num{color:var(--coral-dark);}
  .nav-item.done .nav-num::after{content:" ✓";}
  .nav-text{font-size:13px; line-height:1.4; color:rgba(255,255,255,0.92);}
  .nav-item.active .nav-text{color:var(--brown); font-weight:700;}
  .sidebar-foot{font-size:10.5px; color:rgba(255,255,255,0.7); padding-top:16px; border-top:2px dashed rgba(255,255,255,0.35); line-height:1.6;}

  /* ---------- MAIN ---------- */
  .main-wrap{flex:1; display:flex; flex-direction:column; min-height:100vh;}
  .main-scroll{flex:1; padding:48px 56px 30px; max-width:920px; width:100%; margin:0 auto;}
  @media (max-width: 720px){ .main-scroll{padding:30px 18px 24px;} }

  .stage-eyebrow{font-family:'Baloo 2', sans-serif; font-weight:700; font-size:13px; color:var(--coral-dark); letter-spacing:0.02em; margin-bottom:8px; display:flex; align-items:center; gap:8px;}
  h1.stage-title{font-family:'Jua', sans-serif; font-size:32px; line-height:1.35; color:var(--brown); margin:0 0 12px;}
  .stage-desc{font-size:14.5px; line-height:1.75; color:var(--brown-70); max-width:660px; margin-bottom:30px;}
  .field-block{margin-bottom:26px;}
  .field-label{display:block; font-size:14px; font-weight:700; color:var(--brown); margin-bottom:6px;}
  .field-hint{font-size:12.5px; color:var(--brown-45); margin-bottom:10px; line-height:1.55;}
  input[type="text"], select{
    width:100%; background:#fff; border:2px solid var(--brown); border-radius:var(--radius-sm);
    padding:11px 13px; font-family:'Noto Sans KR', sans-serif; font-size:14.5px; color:var(--brown);
  }
  input[type="text"]:focus, select:focus{ outline:none; border-color:var(--coral-dark); box-shadow:0 0 0 3px rgba(255,140,105,0.25); }
  .row-3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:14px;}
  @media (max-width:640px){.row-3{grid-template-columns:1fr;}}

  /* career cards */
  .career-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(170px,1fr)); gap:12px; margin-bottom:30px;}
  .career-card{border:2.5px solid var(--brown); background:#fff; border-radius:var(--radius-sm); padding:14px 12px; cursor:pointer; box-shadow:var(--shadow-pop-sm); transition:transform .12s ease;}
  .career-card:hover{transform:translate(-1px,-1px);}
  .career-card.selected{background:var(--yellow);}
  .career-icon{font-size:24px; margin-bottom:6px; display:block;}
  .career-name{font-weight:700; font-size:14px; color:var(--brown);}

  .city-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(220px,1fr)); gap:14px; margin-bottom:16px;}
  .city-card{border:2.5px solid var(--brown); background:#fff; border-radius:var(--radius); overflow:hidden; cursor:pointer; box-shadow:var(--shadow-pop-sm); transition:transform .12s ease;}
  .city-card:hover{transform:translate(-1px,-1px);}
  .city-card.selected{outline:3px solid var(--coral-dark); outline-offset:2px;}
  .city-photo{width:100%; height:120px; object-fit:cover; display:block; background:var(--mint-line);}
  .city-body{padding:12px 13px;}
  .city-name{font-weight:700; font-size:14.5px; color:var(--brown); margin-bottom:2px;}
  .city-country{font-size:10.5px; color:var(--mint-dark); font-weight:700; margin-bottom:6px;}
  .city-desc{font-size:12px; color:var(--brown-70); line-height:1.5;}
  .city-detail{
    border:3px solid var(--brown); border-radius:var(--radius); background:#fff; overflow:hidden;
    box-shadow:var(--shadow-pop); margin-bottom:20px; display:grid; grid-template-columns:220px 1fr;
  }
  @media (max-width:640px){.city-detail{grid-template-columns:1fr;}}
  .city-detail img{width:100%; height:100%; object-fit:cover; display:block; min-height:180px;}
  .city-detail-body{padding:20px 22px;}
  .city-detail-name{font-family:'Jua', sans-serif; font-size:21px; color:var(--brown); margin-bottom:2px;}
  .city-detail-country{font-size:11px; font-weight:700; color:var(--mint-dark); margin-bottom:14px;}
  .city-feature-list{list-style:none; margin:0; padding:0;}
  .city-feature-list li{display:flex; gap:8px; font-size:13px; line-height:1.6; color:var(--brown); margin-bottom:8px;}
  .city-feature-list li::before{content:"🌟"; flex-shrink:0;}

  /* region cards */
  .region-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(170px,1fr)); gap:12px; margin-bottom:18px;}
  .region-card{
    border:2.5px solid var(--brown); background:#fff; border-radius:var(--radius-sm);
    padding:14px 12px; text-align:center; cursor:pointer; box-shadow:var(--shadow-pop-sm); transition:transform .12s ease;
  }
  .region-card:hover{transform:translate(-1px,-1px);}
  .region-card.selected{background:var(--sky);}
  .region-icon{font-size:26px; display:block; margin-bottom:6px;}
  .region-name{font-weight:700; font-size:13px; color:var(--brown); margin-bottom:6px;}
  .region-keyword-chip{display:inline-block; background:var(--mint); color:#fff; font-weight:700; font-size:10.5px; padding:3px 9px; border-radius:20px;}
  .recommend-card{border:2.5px dashed var(--mint-dark); background:#fff; border-radius:var(--radius); padding:16px 18px; margin-bottom:18px;}
  .recommend-label{font-size:11px; font-weight:700; color:var(--mint-dark); margin-bottom:6px;}
  .recommend-keyword{display:inline-block; background:var(--mint); color:#fff; font-weight:700; font-size:13px; padding:4px 12px; border-radius:20px; margin-bottom:10px;}
  .recommend-text{font-size:13px; line-height:1.65; color:var(--brown-70);}

  /* region photo (reference) */
  .region-photo-card{border:3px solid var(--brown); border-radius:var(--radius); overflow:hidden; background:#fff; box-shadow:var(--shadow-pop); margin-bottom:20px;}
  .region-photo-card img{width:100%; height:260px; object-fit:cover; display:block;}
  .region-photo-body{padding:16px 20px;}
  .region-photo-title{font-family:'Jua', sans-serif; font-size:17px; color:var(--brown); margin-bottom:6px;}

  /* naver street view card */
  .naver-card{border:3px solid var(--brown); border-radius:var(--radius); background:#fff; box-shadow:var(--shadow-pop); padding:22px; margin-bottom:20px;}
  .naver-card-head{display:flex; align-items:center; gap:12px; margin-bottom:14px;}
  .naver-card-head .emoji{font-size:30px;}
  .naver-card-head .region-title{font-family:'Jua', sans-serif; font-size:19px; color:var(--brown);}
  .naver-card-head .region-sub{font-size:11.5px; color:var(--brown-45);}
  .btn-naver{
    background:var(--naver); border-color:#029947; color:#fff; font-size:15px; padding:13px 22px;
  }
  .guide-list{list-style:none; margin:14px 0 0; padding:0; counter-reset:g;}
  .guide-list li{
    counter-increment:g; display:flex; gap:10px; font-size:13px; line-height:1.6; color:var(--brown-70);
    margin-bottom:8px; align-items:flex-start;
  }
  .guide-list li::before{
    content:counter(g); flex-shrink:0; width:20px; height:20px; border-radius:50%; background:var(--yellow);
    color:var(--brown); font-weight:700; font-size:11px; display:flex; align-items:center; justify-content:center;
    font-family:'Baloo 2',sans-serif;
  }
  .capture-slot{
    border:2.5px dashed var(--brown); border-radius:var(--radius); background:var(--cream-2);
    aspect-ratio:4/3; width:100%; display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:16px; position:relative; cursor:pointer; overflow:hidden; margin-top:16px;
  }
  .capture-slot.filled{border-style:solid; background:#fff;}
  .capture-slot img{width:100%; height:100%; object-fit:cover; display:block; position:absolute; inset:0;}
  .capture-hint{font-size:12.5px; color:var(--brown-45);}
  .capture-hint b{color:var(--coral-dark); display:block; font-size:26px; margin-bottom:6px;}
  .capture-tag{position:absolute; top:9px; left:9px; font-weight:700; font-size:11px; padding:4px 10px; border-radius:14px; background:var(--coral); color:#fff; border:2px solid var(--brown); z-index:2;}

  /* poster city small */
  .poster-city{display:flex; gap:10px; align-items:center; background:var(--cream-2); border-radius:14px; padding:8px; margin-bottom:8px;}
  .poster-city img{width:56px; height:56px; object-fit:cover; border-radius:10px; border:2px solid var(--brown); flex-shrink:0;}

  /* before/after upload */
  .ba-grid{display:grid; grid-template-columns:1fr 1fr; gap:18px; margin-bottom:14px;}
  @media (max-width:640px){.ba-grid{grid-template-columns:1fr;}}
  .ba-slot{
    border:2.5px dashed var(--brown); border-radius:var(--radius); background:#fff;
    aspect-ratio:4/3; width:100%; display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:16px; position:relative; cursor:pointer; overflow:hidden;
  }
  .ba-slot.filled{border-style:solid;}
  .ba-slot img{width:100%; height:100%; object-fit:cover; display:block; position:absolute; inset:0;}
  .ba-tag{position:absolute; top:9px; left:9px; font-weight:700; font-size:11px; padding:4px 10px; border-radius:14px; letter-spacing:0.02em; z-index:2; border:2px solid var(--brown);}
  .ba-tag.before{background:var(--sky);}
  .ba-tag.after{background:var(--mint); color:#fff;}
  .ba-upload-hint{font-size:12.5px; color:var(--brown-45);}
  .ba-upload-hint b{color:var(--coral-dark); display:block; font-size:26px; margin-bottom:6px;}

  /* buttons */
  .btn{font-family:'Baloo 2', sans-serif; font-weight:700; font-size:14px; padding:11px 20px; border-radius:16px; border:2.5px solid var(--brown); background:#fff; color:var(--brown); cursor:pointer; transition:transform .1s ease; display:inline-flex; align-items:center; gap:8px; box-shadow:var(--shadow-pop-sm);}
  .btn:hover{transform:translate(-1px,-1px);}
  .btn:active{transform:translate(1px,1px); box-shadow:1px 1px 0 rgba(91,65,48,0.9);}
  .btn-primary{background:var(--coral); color:#fff;}
  .btn-ghost{background:#fff;}
  .btn:disabled{opacity:0.4; cursor:not-allowed; pointer-events:none;}
  .btn-row{display:flex; gap:12px; margin-top:8px; flex-wrap:wrap;}
  .nav-buttons{display:flex; justify-content:space-between; margin-top:40px; padding-top:22px; border-top:2px dashed var(--mint-line);}

  /* poster summary */
  .poster{background:#fff; border:3px solid var(--brown); border-radius:24px; padding:0; overflow:hidden; box-shadow:var(--shadow-pop);}
  .poster-head{background:var(--mint-dark); color:#fff; padding:22px 28px; display:flex; justify-content:space-between; align-items:center; gap:14px; flex-wrap:wrap;}
  .poster-head h2{font-family:'Jua', sans-serif; font-size:23px; margin:0 0 4px;}
  .poster-head .sub{font-size:12px; color:rgba(255,255,255,0.85);}
  .poster-chip{background:var(--yellow); color:var(--brown); font-weight:700; font-size:12px; padding:6px 14px; border-radius:20px; border:2px solid var(--brown);}
  .poster-body{padding:24px 28px; display:grid; grid-template-columns:1fr 1fr; gap:22px;}
  @media (max-width:640px){.poster-body{grid-template-columns:1fr;}}
  .poster-block{margin-bottom:16px;}
  .poster-label{font-size:11px; font-weight:700; color:var(--coral-dark); margin-bottom:6px; display:flex; align-items:center; gap:6px;}
  .poster-text{font-size:13px; line-height:1.6; color:var(--brown); white-space:pre-wrap;}
  .poster-empty{color:var(--brown-45); font-style:italic;}
  .poster-photo{width:100%; height:130px; object-fit:cover; border-radius:12px; border:2px solid var(--brown); margin-bottom:8px;}
  .poster-ba{grid-column:1 / -1;}
  .poster-ba-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:6px;}
  .poster-ba-grid .frame{border:2.5px solid var(--brown); border-radius:14px; overflow:hidden; aspect-ratio:4/3;}
  .poster-ba-grid img{width:100%; height:100%; object-fit:cover; display:block;}
  .poster-ba-cap{font-size:11px; color:var(--brown-70); margin-top:4px; text-align:center;}

  /* title block */
  .title-block{position:sticky; bottom:0; background:var(--brown); color:#fff; border-top:3px solid var(--coral); padding:11px 56px; display:flex; gap:0; font-size:11px; z-index:10;}
  @media (max-width:720px){.title-block{padding:10px 16px; flex-wrap:wrap; row-gap:6px;}}
  .tb-cell{padding-right:20px; margin-right:20px; border-right:1px solid rgba(255,255,255,0.2);}
  .tb-cell:last-child{border-right:none;}
  .tb-key{color:rgba(255,255,255,0.5); margin-bottom:2px; font-size:9.5px;}
  .tb-val{color:#fff; font-weight:600; font-size:11.5px;}
  .tb-status{margin-left:auto; color:var(--yellow); display:flex; align-items:center; gap:6px;}
  .tb-dot{width:6px; height:6px; border-radius:50%; background:var(--yellow); flex-shrink:0;}

  /* cover */
  .cover-wrap{max-width:640px;}
  .cover-emoji{font-size:38px; margin-bottom:10px;}
  .cover-h{font-family:'Jua', sans-serif; font-size:38px; line-height:1.35; color:var(--brown); margin:0 0 16px;}
  .cover-p{font-size:14.5px; line-height:1.8; color:var(--brown-70); margin-bottom:30px;}
  .steps-preview{display:flex; flex-direction:column; gap:8px; margin-bottom:30px;}
  .steps-preview-row{display:flex; gap:12px; padding:11px 14px; align-items:center; border:2px solid var(--brown); border-radius:14px; background:#fff;}
  .steps-preview-row .num{font-family:'Baloo 2',sans-serif; font-weight:700; font-size:13px; color:var(--coral-dark); width:24px;}
  .steps-preview-row .lbl{font-size:13.5px; color:var(--brown); font-weight:700;}
  .steps-preview-row .desc{font-size:11.5px; color:var(--brown-45); margin-left:auto; text-align:right;}
  @media (max-width:640px){.steps-preview-row .desc{display:none;}}

  .toast{position:fixed; top:20px; right:20px; background:var(--brown); color:#fff; padding:10px 18px; border-radius:14px; font-size:13px; border:2px solid var(--yellow); box-shadow:0 8px 24px rgba(0,0,0,0.2); z-index:100; opacity:0; transform:translateY(-8px); transition:all .25s ease; pointer-events:none;}
  .toast.show{opacity:1; transform:translateY(0);}

  @media (max-width:820px){
    .app{flex-direction:column;}
    .sidebar{width:100%; height:auto; position:relative; padding:16px;}
    .nav-list{display:flex; overflow-x:auto; gap:4px;}
    .nav-item{flex-direction:column; min-width:96px; align-items:center; text-align:center;}
    .sidebar-foot{display:none;}
  }
</style>
</head>
<body>

<div class="app">
  <aside class="sidebar">
    <div class="brand-emoji">🏘️</div>
    <div class="brand-title">우리 동네<br>공간 혁신 프로젝트</div>
    <div class="brand-sub">GIMPO URBAN LAB</div>

    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <div class="progress-label" id="progressLabel">0 / 5 단계 완료</div>

    <ul class="nav-list" id="navList"></ul>

    <div class="sidebar-foot">작성한 내용은 이 기기에<br>자동 저장돼요.<br>완료 후 선생님께 제출하세요 🌱</div>
  </aside>

  <div class="main-wrap">
    <div class="main-scroll" id="mainScroll"></div>
    <div class="title-block" id="titleBlock"></div>
  </div>
</div>

<div class="toast" id="toast">저장되었습니다</div>

<script>
/* ============ DATA ============ */
function wmImg(name, w){ return `https://commons.wikimedia.org/wiki/Special:FilePath/${name}?width=${w||800}`; }

const CITIES = {
  vienna:{name:'오스트리아 빈', country:'AUSTRIA · VIENNA', desc:'낮은 범죄율, 높은 의료·교육 수준, 트램 중심 교통', img:wmImg('Vienna_Skyline.jpg'),
    details:['세계에서 가장 살기 좋은 도시로 여러 해 동안 선정될 만큼 낮은 범죄율과 안전한 치안을 자랑해요.','전 국민 대상 보편적 의료보장 체계를 갖춰 병원 접근성과 의료 서비스 만족도가 매우 높아요.','무상에 가까운 대학 교육과 촘촘한 직업교육 시스템으로 교육 수준이 높아요.','도시 전역에 촘촘히 연결된 트램·지하철망 덕분에 자동차 없이도 이동이 편리해요.','오페라, 미술관, 궁전 등 풍부한 문화유산과 녹지 공원이 도시 곳곳에 자리해요.']},
  copenhagen:{name:'덴마크 코펜하겐', country:'DENMARK · COPENHAGEN', desc:'창의력 교육, 촘촘한 보육·의료 지원', img:wmImg('Nyhavn_copenhagen.jpg'),

  {id:'career', num:'01', label:'진로와 도시 사례'},

const STORAGE_KEY = 'gimpo-space-project-v4';
const TEACHER_EMAIL = 'tjdustoa23@gmail.com';
const CLASS_GROUPS = ['A반','B반','C반','D반','E반'];

/* ============ STATE ============ */
let state = {
  student:{classGroup:'', number:'', name:''},
  career:'', cityChoice:'',
  analysis:{region:''},
  streetview:{capture:null, caption:''},
  visualize:{beforeImg:null, afterImg:null, beforeCaption:'', afterCaption:''},
  currentStep:0,
};
let saveTimer = null;

/* ============ STORAGE ============ */
async function loadState(){
  try{
    const res = await window.storage.get(STORAGE_KEY, false);
    if(res && res.value){
      const loaded = JSON.parse(res.value);
      state = Object.assign({}, state, loaded);
      state.analysis = Object.assign({region:''}, state.analysis||{});
      state.streetview = Object.assign({capture:null, caption:''}, state.streetview||{});
      state.student = Object.assign({classGroup:'', number:'', name:''}, state.student||{});
    }
  }catch(e){ /* no saved data yet */ }
  render();
}
function saveStateDebounced(){ clearTimeout(saveTimer); saveTimer = setTimeout(saveStateNow, 700); }
async function saveStateNow(){
  try{ await window.storage.set(STORAGE_KEY, JSON.stringify(state), false); showToast('자동 저장됨 🌿'); }
  catch(e){ console.error('저장 실패', e); }
}
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(()=>t.classList.remove('show'), 1600);
}

/* ============ HELPERS ============ */
function esc(s){ return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function stepDone(id){
  switch(id){
    case 'cover': return !!(state.student.name && state.student.number && state.student.classGroup);
    case 'career': return !!(state.career && state.cityChoice);
    case 'analysis': return !!(state.analysis.region);
    case 'streetview': return !!(state.streetview.capture);
    case 'visualize': return !!(state.visualize.beforeImg && state.visualize.afterImg);
    default: return false;
  }
}
function completedCount(){ return STEPS.slice(0,-1).filter(s=>stepDone(s.id)).length; }
function goTo(idx){
  state.currentStep = idx; saveStateDebounced(); render();
  document.getElementById('mainScroll').scrollTo({top:0, behavior:'instant'});
}

/* ============ RENDER: SIDEBAR / TITLE BLOCK ============ */
function renderSidebar(){
  const nav = document.getElementById('navList');
  nav.innerHTML = STEPS.map((s,i)=>{
    const active = i===state.currentStep ? 'active' : '';
    const done = stepDone(s.id) ? 'done' : '';
    return `<li class="nav-item ${active} ${done}" data-idx="${i}">
      <span class="nav-num">${s.num}</span><span class="nav-text">${s.label}</span>
    </li>`;
  }).join('');
  nav.querySelectorAll('.nav-item').forEach(el=> el.addEventListener('click', ()=> goTo(parseInt(el.dataset.idx))));
  const cc = completedCount();
  const total = STEPS.length-1;
  document.getElementById('progressFill').style.width = (cc/total*100)+'%';
  document.getElementById('progressLabel').textContent = `${cc} / ${total} 단계 완료`;
}
function renderTitleBlock(){
  const s = STEPS[state.currentStep];
  const tb = document.getElementById('titleBlock');
  const today = new Date();
  const dateStr = `${today.getFullYear()}.${String(today.getMonth()+1).padStart(2,'0')}.${String(today.getDate()).padStart(2,'0')}`;
  tb.innerHTML = `
    <div class="tb-cell"><div class="tb-key">PROJECT</div><div class="tb-val">공간 혁신</div></div>
    <div class="tb-cell"><div class="tb-key">STUDENT</div><div class="tb-val">${esc(state.student.classGroup)||'-'} ${esc(state.student.number)||'-'}번 ${esc(state.student.name)||'미입력'}</div></div>
    <div class="tb-cell"><div class="tb-key">STAGE</div><div class="tb-val">${s.num} · ${s.label}</div></div>
    <div class="tb-cell"><div class="tb-key">DATE</div><div class="tb-val">${dateStr}</div></div>
    <div class="tb-status"><span class="tb-dot"></span>진행 중</div>
  `;
}

/* ============ RENDER MAIN ============ */
function render(){
  renderSidebar(); renderTitleBlock();
  const el = document.getElementById('mainScroll');
  const s = STEPS[state.currentStep];
  el.innerHTML = renderStep(s.id);
  attachStepEvents(s.id);
}
function navButtons(prevLabel, nextLabel){
  return `<div class="nav-buttons">
    ${state.currentStep>0 ? `<button class="btn btn-ghost" id="btnPrev">← ${prevLabel}</button>` : `<span></span>`}

/* ============ EVENTS ============ */
function attachStepEvents(id){
  const btnPrev = document.getElementById('btnPrev');
  const btnNext = document.getElementById('btnNext');
  if(btnPrev) btnPrev.addEventListener('click', ()=> goTo(state.currentStep-1));
  if(btnNext) btnNext.addEventListener('click', ()=> goTo(state.currentStep+1));

  if(id==='cover'){
    const sel = document.getElementById('inClassGroup');
    if(sel) sel.addEventListener('change', ()=>{ state.student.classGroup = sel.value; saveStateDebounced(); });
    bindText('inNumber', v=>state.student.number=v);
    bindText('inName', v=>state.student.name=v);
    const btnStart = document.getElementById('btnStart');
    if(btnStart) btnStart.addEventListener('click', ()=> goTo(1));
  }

  if(id==='career'){
    document.querySelectorAll('.career-card').forEach(el=>{
      el.addEventListener('click', ()=>{
        state.career = el.dataset.career; state.cityChoice = '';
        saveStateDebounced(); render();
      });
    });
    document.querySelectorAll('.city-card').forEach(el=>{
      el.addEventListener('click', ()=>{ state.cityChoice = el.dataset.city; saveStateDebounced(); render(); });
    });
  }

  if(id==='analysis'){
    document.querySelectorAll('.region-card').forEach(el=>{
      el.addEventListener('click', ()=>{
        state.analysis.region = el.dataset.region;
        saveStateDebounced(); render();
      });
    });
  }

  if(id==='streetview'){
    const slot = document.getElementById('captureSlot');
    if(slot) slot.addEventListener('click', ()=> document.getElementById('fileCapture').click());
    const fileInput = document.getElementById('fileCapture');
    if(fileInput) fileInput.addEventListener('change', handleCaptureUpload);
    bindText('inCaptureCaption', v=>state.streetview.caption=v);
  }

  if(id==='visualize'){
    document.querySelectorAll('.ba-slot').forEach(el=>{
      el.addEventListener('click', ()=>{
        const kind = el.dataset.kind;
        document.getElementById(kind==='before'?'fileBefore':'fileAfter').click();
      });
    });
    document.getElementById('fileBefore').addEventListener('change', e=>handleImage(e,'before'));
    document.getElementById('fileAfter').addEventListener('change', e=>handleImage(e,'after'));
    document.querySelectorAll('.ba-caption').forEach(el=>{
      el.addEventListener('input', ()=>{
        if(el.dataset.kind==='before') state.visualize.beforeCaption = el.value;
        else state.visualize.afterCaption = el.value;
        saveStateDebounced();
      });
    });
  }

  if(id==='summary'){
    document.getElementById('btnPdf').addEventListener('click', generatePDF);
    document.getElementById('btnEmail').addEventListener('click', submitByEmail);
  }
}
function bindText(elId, setter){
  const el = document.getElementById(elId);
  if(!el) return;
  el.addEventListener('input', ()=>{ setter(el.value); saveStateDebounced(); });
}

/* shared: crop an uploaded image file to a 4:3 box and return a dataURL via callback */
function cropTo43(file, callback){
  const reader = new FileReader();
  reader.onload = function(ev){
    const img = new Image();
    img.onload = function(){
      const targetRatio = 4/3;
      let sx=0, sy=0, sw=img.width, sh=img.height;
      const srcRatio = sw/sh;
      if(srcRatio > targetRatio){ sw = sh*targetRatio; sx = (img.width-sw)/2; }
      else { sh = sw/targetRatio; sy = (img.height-sh)/2; }
      const outW = 900, outH = 675;
      const canvas = document.createElement('canvas');
      canvas.width = outW; canvas.height = outH;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, sx, sy, sw, sh, 0, 0, outW, outH);
      callback(canvas.toDataURL('image/jpeg', 0.85));
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}
function handleImage(e, kind){
  const file = e.target.files[0];
  if(!file) return;
  cropTo43(file, (dataUrl)=>{
    if(kind==='before') state.visualize.beforeImg = dataUrl;
    else state.visualize.afterImg = dataUrl;
    saveStateDebounced(); render();
  });
}
function handleCaptureUpload(e){
  const file = e.target.files[0];
  if(!file) return;
  cropTo43(file, (dataUrl)=>{
    state.streetview.capture = dataUrl;
    saveStateDebounced(); render();
  });
}

  const btn = document.getElementById('btnPdf');
  const orig = btn.textContent;
  btn.textContent = 'PDF 생성 중...'; btn.disabled = true;
  try{
    const element = document.getElementById('summary-capture');
    const canvas = await html2canvas(element, {scale:2, backgroundColor:'#ffffff', useCORS:true});
    const imgData = canvas.toDataURL('image/jpeg', 0.95);
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF('p','pt','a4');
    const pageWidth = pdf.internal.pageSize.getWidth();
    const pageHeight = pdf.internal.pageSize.getHeight();
    const imgWidth = pageWidth;
    const imgHeight = canvas.height*imgWidth/canvas.width;
    let heightLeft = imgHeight, position = 0;
    pdf.addImage(imgData,'JPEG',0,position,imgWidth,imgHeight);
    heightLeft -= pageHeight;
    while(heightLeft > 0){
      position = heightLeft - imgHeight;
      pdf.addPage();
      pdf.addImage(imgData,'JPEG',0,position,imgWidth,imgHeight);
      heightLeft -= pageHeight;
    }
    pdf.save(`공간혁신프로젝트_${state.student.name||'학생'}.pdf`);
    showToast('PDF가 다운로드되었습니다 🎉');
  }catch(err){ console.error(err); showToast('PDF 생성 중 오류가 발생했습니다'); }
  btn.textContent = orig; btn.disabled = false;
}

/* ============ EMAIL ============ */
function submitByEmail(){
  const career = CAREERS.find(c=>c.id===state.career);
  const city = CITIES[state.cityChoice];
  const region = GIMPO_REGIONS.find(r=>r.id===state.analysis.region);
  const who = `${state.student.classGroup||''} ${state.student.number||''}번 ${state.student.name||'학생'}`.trim();
  const subject = `[공간 혁신 프로젝트] ${who} 제출`;
  const bodyLines = [
    `안녕하세요, ${state.student.name||''}입니다.`,
    `'우리 동네 공간 혁신 프로젝트' 탐구 결과를 제출합니다.`,
    ``,
    `[진로 분야] ${career?career.name:'-'}`,
    `[참고 도시 사례] ${city?city.name:'-'}`,
    `[우리 지역] ${region?region.name:'-'}`,
    `[거리뷰에서 찾은 문제] ${state.streetview.caption||'-'}`,
    ``,
    `* 다운로드한 요약 PDF 파일을 이 메일에 첨부해서 보내주세요.`,
  ];
  const mailto = `mailto:${TEACHER_EMAIL}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(bodyLines.join('\n'))}`;
  window.location.href = mailto;
}
